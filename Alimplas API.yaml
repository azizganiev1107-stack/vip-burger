components:
  schemas:
    AdminCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        role_id:
          type: integer
          writeOnly: true
        phone:
          type: string
          maxLength: 15
        password:
          type: string
          writeOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          nullable: true
          title: Oxirgi kirish
      required:
      - created_at
      - first_name
      - id
      - last_name
      - password
      - phone
      - role
      - role_id
      - updated_at
    AdminGetMe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        phone:
          type: string
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi kirish
        is_staff:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - full_name
      - id
      - is_staff
      - is_superuser
      - last_login
      - last_name
      - phone
      - role
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 100
        description:
          type: string
          nullable: true
          title: Описание
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
      required:
      - created_at
      - id
      - name
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    Inventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item_details:
          allOf:
          - $ref: '#/components/schemas/InventoryItem'
          readOnly: true
        warehouse_details:
          allOf:
          - $ref: '#/components/schemas/Warehouse'
          readOnly: true
        is_low_stock:
          type: boolean
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Количество
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Минимальный остаток
        last_updated:
          type: string
          format: date-time
          readOnly: true
          title: Последнее обновление
        item:
          type: integer
          title: Товар
        warehouse:
          type: integer
          title: Склад
      required:
      - id
      - is_low_stock
      - item
      - item_details
      - last_updated
      - warehouse
      - warehouse_details
    InventoryItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        unit_details:
          allOf:
          - $ref: '#/components/schemas/Unit'
          readOnly: true
        supplier_details:
          allOf:
          - $ref: '#/components/schemas/Supplier'
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 150
        sku:
          type: string
          nullable: true
          title: Артикул
          maxLength: 50
        description:
          type: string
          title: Описание
        purchase_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Закупочная цена
        is_active:
          type: boolean
          title: Активный
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
        unit:
          type: integer
          title: Единица измерения
        supplier:
          type: integer
          nullable: true
          title: Поставщик
      required:
      - created_at
      - id
      - name
      - supplier_details
      - unit
      - unit_details
      - updated_at
    Login:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - id
      - password
      - phone
    MovementTypeEnum:
      enum:
      - in
      - out
      - transfer
      type: string
      description: |-
        * `in` - Поступление (Kirim)
        * `out` - Списание (Chiqim)
        * `transfer` - Перемещение (Filialga yuborish)
