  /api/v1/finance/transactions/:
    get:
      operationId: finance_transactions_list
      description: Barcha kirim va chiqim operatsiyalari ro'yxati.
      summary: Tranzaksiyalar ro'yxati
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - card
          - cash
          - online
        description: |-
          * `cash` - Naqd (Cash)
          * `card` - Karta (Card)
          * `online` - Online (Click/Payme)
      - in: query
        name: shift
